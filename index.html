<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>Aurora TV</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="boot" class="boot"><div class="brand-mark">A</div><div class="brand-name">AURORA TV</div><div class="boot-sub">Seu streaming. Do seu jeito.</div></div>
<section id="loginScreen" class="login-screen hidden"><div class="login-card"><div class="brand-row"><div class="brand-mark small">A</div><div><h1>Aurora TV</h1><p>Conecte seu serviço IPTV por Xtream Codes</p></div></div><label>Servidor<input id="serverInput" data-focusable placeholder="http://servidor:porta"></label><label>Usuário<input id="userInput" data-focusable autocomplete="username"></label><label>Senha<input id="passInput" data-focusable type="password" autocomplete="current-password"></label><div class="login-options"><label class="check"><input id="rememberInput" type="checkbox" checked> Salvar acesso nesta TV</label><button id="demoBtn" data-focusable class="ghost">Testar interface</button></div><button id="loginBtn" data-focusable class="primary wide">Entrar</button><div id="loginError" class="error"></div></div></section>
<div id="appShell" class="app-shell hidden"><aside class="sidebar"><div class="side-logo"><div class="brand-mark small">A</div><span>AURORA</span></div><nav id="mainNav"><button data-focusable data-section="home" class="nav-item active">⌂ <span>Início</span></button><button data-focusable data-section="live" class="nav-item">◉ <span>Ao vivo</span></button><button data-focusable data-section="movies" class="nav-item">▶ <span>Filmes</span></button><button data-focusable data-section="series" class="nav-item">▤ <span>Séries</span></button><button data-focusable data-section="favorites" class="nav-item">★ <span>Favoritos</span></button><button data-focusable data-section="search" class="nav-item">⌕ <span>Buscar</span></button><button data-focusable data-section="settings" class="nav-item">⚙ <span>Ajustes</span></button></nav><div class="side-bottom"><span id="connectionBadge" class="status-dot">●</span><span id="profileName">Conectado</span></div></aside>
<main class="content"><header class="topbar"><div><div id="pageEyebrow" class="eyebrow">AURORA TV</div><h2 id="pageTitle">Início</h2></div><div class="top-actions"><span id="clock"></span><button id="refreshBtn" data-focusable class="icon-btn" title="Atualizar">↻</button></div></header><section id="hero" class="hero"></section><section id="view" class="view"></section></main></div>
<div id="detailModal" class="modal hidden"><div class="modal-panel"><button id="detailClose" data-focusable class="close-btn">×</button><div id="detailBody"></div></div></div>
<div id="playerOverlay" class="player-overlay hidden"><div id="videoStage" class="video-stage mode-auto"><video id="video" playsinline></video><div id="playerGradient" class="player-gradient"></div><div id="playerTop"><button id="playerBack" data-focusable class="player-icon">←</button><div><div id="playerKind" class="eyebrow"></div><h2 id="playerTitle"></h2></div><div id="liveBadge" class="live-badge hidden">AO VIVO</div></div><div id="playerCenter"><button id="rewindBtn" data-focusable class="round-control">↶ 10</button><button id="playPauseBtn" data-focusable class="round-control main">▶</button><button id="forwardBtn" data-focusable class="round-control">10 ↷</button></div><div id="playerBottom"><div class="timeline-row"><span id="currentTime">00:00</span><div id="timeline" class="timeline"><div id="progressBar"></div></div><span id="durationTime">00:00</span></div><div class="player-actions"><button id="aspectBtn" data-focusable class="player-action">▣ Formato</button><button id="restartBtn" data-focusable class="player-action">↺ Reiniciar</button><span id="aspectLabel">Automático</span></div></div></div><div id="aspectMenu" class="aspect-menu hidden"><h3>Formato da imagem</h3><button data-focusable data-aspect="original">Original</button><button data-focusable data-aspect="auto">Automático</button><button data-focusable data-aspect="letterbox">Letterbox</button><button data-focusable data-aspect="fill">Preencher tela</button><button data-focusable data-aspect="16:9">16:9</button><button data-focusable data-aspect="4:3">4:3</button><button data-focusable data-aspect="zoom">Zoom</button><button data-focusable data-aspect="reset">Reiniciar imagem</button></div></div>
<div id="toast" class="toast hidden"></div><div id="loading" class="loading hidden"><div class="spinner"></div><span>Carregando...</span></div>
<script src="core.js"></script><script src="xtream.js"></script><script src="mock.js"></script><script src="player.js"></script><script src="app.js"></script>
</body></html>
